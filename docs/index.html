.boot-brand{display:flex;align-items:center;gap:13px;font-size:14px;letter-spacing:1px;color:#c9dcf9}.boot-brand>svg{color:#6ba3ff}.boot-brand small{font-size:12px;color:#6783ac;margin-left:8px}.boot-center{flex:1;display:grid;place-items:center;width:100%;padding:45px 0}.boot-loading{text-align:center;display:flex;align-items:center;flex-direction:column;gap:22px}.boot-spinner{display:block;width:50px;height:50px;border-radius:50%;border:2px solid #3b82f626;border-top-color:#71a8ff;border-right-color:#3b82f6;box-shadow:0 0 30px #3b82f617;animation:boot-spin .8s linear infinite}.boot-loading>p{font-size:25px;font-weight:450;letter-spacing:-.5px}.boot-caption{font-size:11px;letter-spacing:1.5px;color:#6c86a9}.boot-footer{text-align:center;font-size:11px;letter-spacing:1.5px;color:#4e6a91;padding-top:20px}
